name: Generate music on Kaggle (ACE-Step 1.5)

on:
  workflow_dispatch:
    inputs:
      prompt: {description: "Music description (Hebrew or English, max 512 chars)", required: true, type: string}
      lyrics: {description: "Optional lyrics (max 4096 chars)", required: false, type: string}
      vocal_language:
        description: "Vocal language"
        required: true
        type: choice
        default: en
        options: [en, he, es, fr, de, ja, zh, unknown]
      instrumental: {description: "Instrumental only", required: true, type: boolean, default: false}
      duration: {description: "Duration in seconds (10-600)", required: true, type: string, default: "30"}
      num_samples: {description: "Number of versions (1-3)", required: true, type: string, default: "1"}
      seed: {description: "Seed (-1 = random)", required: true, type: string, default: "-1"}
      wait_for_result: {description: "Wait for Kaggle, download and publish the result", required: true, type: boolean, default: true}
      max_wait_minutes: {description: "Maximum wait time in minutes", required: true, type: string, default: "240"}

permissions:
  contents: write

concurrency:
  group: kaggle-music-run
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      KAGGLE_USERNAME: ${{ secrets.kagle_user_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import six; from kaggle.cli import main; print('Kaggle CLI import check passed')"

      - name: Configure Kaggle authentication
        env:
          KAGGLE_SECRET: ${{ secrets.kagle_key }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_SECRET" ]; then
            echo "::error::Missing secrets kagle_user_name / kagle_key"; exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          if printf '%s' "$KAGGLE_SECRET" | grep -Eq '^[0-9a-f]{32}$'; then
            # Legacy 32-hex API key
            python -c 'import json,os; print(json.dumps({"username":os.environ["KAGGLE_USERNAME"],"key":os.environ["KAGGLE_SECRET"]}))' > "$HOME/.kaggle/kaggle.json"
            chmod 600 "$HOME/.kaggle/kaggle.json"
          else
            # New-style access token
            printf '%s' "$KAGGLE_SECRET" > "$HOME/.kaggle/access_token"
            chmod 600 "$HOME/.kaggle/access_token"
          fi

      - name: Validate inputs and build kernel bundle
        env:
          IN_PROMPT: ${{ inputs.prompt }}
          IN_LYRICS: ${{ inputs.lyrics }}
          IN_VOCAL_LANGUAGE: ${{ inputs.vocal_language }}
          IN_INSTRUMENTAL: ${{ inputs.instrumental }}
          IN_DURATION: ${{ inputs.duration }}
          IN_NUM_SAMPLES: ${{ inputs.num_samples }}
          IN_SEED: ${{ inputs.seed }}
        run: python scripts/prepare_kernel.py

      - name: Submit kernel to Kaggle
        run: |
          if ! kaggle kernels push -p build/kernel --accelerator NvidiaTeslaT4; then
            echo "::warning::Push with --accelerator failed; retrying with the accelerator from kernel-metadata.json"
            kaggle kernels push -p build/kernel
          fi

      - name: Wait for Kaggle execution
        if: ${{ inputs.wait_for_result }}
        env:
          MAX_WAIT_MINUTES: ${{ inputs.max_wait_minutes }}
        run: |
          REF="$(cat build/kernel_ref.txt)"
          MAX_WAIT="${MAX_WAIT_MINUTES:-240}"
          case "$MAX_WAIT" in ''|*[!0-9]*) MAX_WAIT=240;; esac
          deadline=$(( $(date +%s) + MAX_WAIT * 60 ))
          result=timeout
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if ! status="$(kaggle kernels status "$REF" 2>&1)"; then
              echo "::warning::Could not read Kaggle status: $status"
              sleep 45; continue
            fi
            echo "$(date -u +%H:%M:%S) $status"
            lower="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              *complete*) result=complete; break ;;
              *error*|*cancel*|*fail*) result=failed; break ;;
            esac
            sleep 45
          done
          echo "$result" > kaggle-result.txt
          echo "Kaggle execution result: $result"

      - name: Download Kaggle output and logs
        if: ${{ always() && inputs.wait_for_result && hashFiles('build/kernel_ref.txt') != '' }}
        continue-on-error: true
        run: |
          mkdir -p out
          kaggle kernels output "$(cat build/kernel_ref.txt)" -p out

      - name: Fail if Kaggle did not complete
        if: ${{ inputs.wait_for_result }}
        run: |
          result="$(cat kaggle-result.txt 2>/dev/null || echo missing)"
          if [ "$result" != "complete" ]; then
            if [ -f out/music-output/failure.txt ]; then
              echo "::group::failure.txt from Kaggle"; cat out/music-output/failure.txt; echo "::endgroup::"
            fi
            echo "::error::Kaggle execution ended with status: $result"
            exit 1
          fi

      - name: Publish release
        if: ${{ success() && inputs.wait_for_result }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t FILES < <(find out -type f \( -name '*.wav' -o -name 'run_info.json' \) | sort)
          if ! printf '%s\n' "${FILES[@]}" | grep -q '\.wav$'; then
            echo "::error::Kaggle completed but no WAV files were downloaded."; exit 1
          fi
          TAG="ace-step-run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "${FILES[@]}" \
            --title "ACE-Step music run #${GITHUB_RUN_NUMBER}" \
            --notes-file build/release_notes.md
          echo "Release: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: ${{ always() && inputs.wait_for_result }}
        uses: actions/upload-artifact@v4
        with:
          name: ace-step-run-${{ github.run_number }}
          path: |
            out/
            kaggle-result.txt
          if-no-files-found: warn
