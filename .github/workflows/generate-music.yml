name: Generate music on Kaggle (ACE-Step 1.5)
on:
  workflow_dispatch:
    inputs:
      prompt: {description: "Music description (Hebrew or English)", required: true, type: string}
      lyrics: {description: "Optional lyrics", required: false, type: string}
      vocal_language:
        description: "Vocal language"
        required: true
        type: choice
        default: en
        options: [en, he, es, fr, de, ja, zh, unknown]
      instrumental: {description: "Instrumental only", required: true, type: boolean, default: false}
      duration: {description: "Duration in seconds (10-600)", required: true, type: string, default: "30"}
      num_samples: {description: "Number of versions (1-3)", required: true, type: string, default: "1"}
      seed: {description: "Seed (-1 random)", required: true, type: string, default: "-1"}
      wait_for_result: {description: "Wait for Kaggle and publish results", required: true, type: boolean, default: true}
      max_wait_minutes: {description: "Maximum wait time", required: true, type: string, default: "240"}
permissions: {contents: write}
concurrency: {group: kaggle-music-run, cancel-in-progress: false}
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env: {KAGGLE_USERNAME: "${{ secrets.kagle_user_name }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install Kaggle CLI
        run: pip install kaggle
      - name: Configure Kaggle authentication
        env: {KAGLE_KEY_SECRET: "${{ secrets.kagle_key }}"}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGLE_KEY_SECRET" ]; then echo "::error::Missing Kaggle secrets"; exit 1; fi
          mkdir -p "$HOME/.kaggle"
          if printf '%s' "$KAGLE_KEY_SECRET" | grep -Eq '^[0-9a-f]{32}$'; then
            KAGGLE_USERNAME="$KAGGLE_USERNAME" KAGGLE_KEY="$KAGLE_KEY_SECRET" python -c 'import json,os; print(json.dumps({"username":os.environ["KAGGLE_USERNAME"],"key":os.environ["KAGGLE_KEY"]}))' > "$HOME/.kaggle/kaggle.json"
            chmod 600 "$HOME/.kaggle/kaggle.json"
          else
            printf '%s' "$KAGLE_KEY_SECRET" > "$HOME/.kaggle/access_token"; chmod 600 "$HOME/.kaggle/access_token"
          fi
      - name: Prepare kernel
        env:
          IN_PROMPT: "${{ inputs.prompt }}"
          IN_LYRICS: "${{ inputs.lyrics }}"
          IN_VOCAL_LANGUAGE: "${{ inputs.vocal_language }}"
          IN_INSTRUMENTAL: "${{ inputs.instrumental }}"
          IN_DURATION: "${{ inputs.duration }}"
          IN_NUM_SAMPLES: "${{ inputs.num_samples }}"
          IN_SEED: "${{ inputs.seed }}"
        run: python scripts/prepare_kernel.py
      - name: Push kernel to Kaggle
        run: kaggle kernels push -p build/kernel
      - name: Wait for kernel and download output
        if: "${{ inputs.wait_for_result }}"
        env: {MAX_WAIT_MINUTES: "${{ inputs.max_wait_minutes }}"}
        run: |
          REF="$(cat build/kernel_ref.txt)"; MAX_WAIT="${MAX_WAIT_MINUTES:-240}"
          case "$MAX_WAIT" in ''|*[!0-9]*) MAX_WAIT=240;; esac
          deadline=$(( $(date +%s) + MAX_WAIT * 60 )); result=timeout; sleep 60
          while [ "$(date +%s)" -lt "$deadline" ]; do
            status="$(kaggle kernels status "$REF" 2>&1)" || { echo "$status"; sleep 60; continue; }
            echo "$status"; lower="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in *complete*) result=complete; break;; *error*|*cancel*|*fail*) result=failed; break;; esac
            sleep 60
          done
          mkdir -p out; kaggle kernels output "$REF" -p out || true
          [ "$result" = complete ] || { echo "::error::Kaggle result: $result"; exit 1; }
      - name: Publish release
        if: "${{ success() && inputs.wait_for_result }}"
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          TAG="ace-step-run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"; ZIP="ace_step_music_${GITHUB_RUN_NUMBER}.zip"
          (cd out && zip -r "../$ZIP" .)
          gh release create "$TAG" "$ZIP" --title "ACE-Step music run #${GITHUB_RUN_NUMBER}" --notes "Generated with ACE-Step 1.5 XL Turbo on Kaggle."
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
      - name: Upload result
        if: "${{ always() && inputs.wait_for_result }}"
        uses: actions/upload-artifact@v4
        with: {name: ace-step-music-output, path: out/, if-no-files-found: warn}
