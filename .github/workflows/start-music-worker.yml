name: Start ACE-Step music worker

# A persistent Kaggle session: model weights are loaded once and reused for
# every queued music request. Kaggle still enforces session and weekly quotas.
on:
  workflow_dispatch:
    inputs:
      idle_minutes:
        description: "Stop after this many idle minutes"
        required: true
        default: "30"
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: ace-step-music-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle requests

      - name: Configure Kaggle authentication
        env:
          KAGGLE_USERNAME: ${{ secrets.kagle_user_name }}
          KAGGLE_SECRET: ${{ secrets.kagle_key }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_SECRET" ]; then
            echo "::error::Missing Kaggle secrets kagle_user_name / kagle_key"
            exit 1
          fi
          mkdir -p "$HOME/.kaggle"
          if printf '%s' "$KAGGLE_SECRET" | grep -Eq '^[0-9a-f]{32}$'; then
            python -c 'import json,os; print(json.dumps({"username":os.environ["KAGGLE_USERNAME"],"key":os.environ["KAGGLE_SECRET"]}))' > "$HOME/.kaggle/kaggle.json"
            chmod 600 "$HOME/.kaggle/kaggle.json"
          else
            printf '%s' "$KAGGLE_SECRET" > "$HOME/.kaggle/access_token"
            chmod 600 "$HOME/.kaggle/access_token"
          fi

      - name: Push persistent music worker to Kaggle
        id: push
        env:
          KAGGLE_USERNAME: ${{ secrets.kagle_user_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IN_IDLE_MINUTES: ${{ inputs.idle_minutes }}
          IN_ACCELERATOR: NvidiaTeslaT4
        run: python scripts/push_music_worker.py

      - name: Wait for worker to stop
        env:
          KERNEL_REF: ${{ steps.push.outputs.ref }}
          MAX_WAIT_MINUTES: "330"
        run: python scripts/wait_music_worker.py

      - name: Download worker diagnostics
        if: always() && steps.push.outputs.ref != ''
        continue-on-error: true
        env:
          KERNEL_REF: ${{ steps.push.outputs.ref }}
        run: |
          mkdir -p out
          kaggle kernels output "$KERNEL_REF" -p out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ace-step-music-worker-${{ github.run_number }}
          path: |
            out/
            music-worker-result.txt
          if-no-files-found: warn
